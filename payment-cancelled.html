<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://rodgermin10-design.github.io/svoy-tehnadzor/payment-cancelled.html">
  <title>Оплата не завершена — Свой технадзор</title>
  <style>
    :root{--navy:#0f2a43;--amber:#e8862d;--bg:#f5f7fa;--muted:#6b7a89}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy)}
    main{max-width:680px;margin:8vh auto;padding:42px 30px;background:#fff;border-radius:12px;box-shadow:0 8px 28px rgba(15,42,67,.12);text-align:center}
    h1{margin:0 0 16px;font-size:32px;line-height:1.2} p{margin:12px 0;color:#334e68}.muted{color:var(--muted);font-size:14px}.btn{display:inline-block;margin:16px 6px 0;padding:12px 20px;background:var(--amber);border-radius:7px;color:#fff;font-weight:700;text-decoration:none}.btn.secondary{background:var(--navy)}
  </style>
</head>
<body>
  <main>
    <h1>Оплата не завершена</h1>
    <p>Деньги за комплект не списаны либо платёж был отменён. Вы можете вернуться на сайт и повторить оплату, когда будете готовы.</p>
    <a class="btn" href="/svoy-tehnadzor/#price">Вернуться к комплектам</a>
    <a class="btn secondary" href="https://t.me/svoy_tehnadzor_bot">Написать в бот</a>
    <p class="muted">Если банк списал деньги, но доступ не пришёл, не оплачивайте повторно — напишите в бот и укажите номер заказа.</p>
  </main>
</body>
</html>
